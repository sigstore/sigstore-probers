name: Production Sigstore Prober

on:
  workflow_dispatch:
    inputs:
      trigger_pager_duty_test:
        description: 'Trigger PagerDuty as a test'
        required: false
        type: boolean
  schedule:
    # run every 15 minutes, as often as Github Actions allows
    - cron:  '0/15 * * * *'

permissions: {}

jobs:
  prober:
    name: Initial prober run
    uses: ./.github/workflows/reusable-prober.yml
    permissions:
      id-token: write
      contents: read
      packages: write
      issues: write
    secrets:
      PAGERDUTY_INTEGRATION_KEY: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}
    with:
      alert_on_failure: false
      # on scheduled runs inputs are null: handle this case
      trigger_pager_duty_test: ${{ inputs.trigger_pager_duty_test == true }}
      tuf_repo: "https://tuf-repo-cdn.sigstore.dev"

  wait-on-failure:
    name: Let GitHub take a breath before retrying prober
    needs: prober
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: sleep 30

  prober-with-alerts:
    name: Run prober after initial failure, alert on failure
    uses: ./.github/workflows/reusable-prober.yml
    needs: [prober, wait-on-failure]
    if: failure()
    permissions:
      id-token: write
      contents: read
      packages: write
      issues: write
    secrets:
      PAGERDUTY_INTEGRATION_KEY: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}
    with:
      alert_on_failure: true
      tuf_repo: "https://tuf-repo-cdn.sigstore.dev"
